<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>結果</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1 class="{{ result_type }}">{{ result }}</h1>

        {% if result_type == "incorrect" %}
            <p class="correct-answer">
                正解は「{{ correct_answer }}」です
            </p>
        {% endif %}

        {% if question_finished %}
            <p>お疲れさまでした！</p>
            <a class="choice" href="/">もう一度挑戦</a>
        {% else %}
            <a class="choice" href="/next">次の問題へ</a>
        {% endif %}

    </div>

</body>
</html>
